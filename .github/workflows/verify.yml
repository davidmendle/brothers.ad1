name: Verify Brothers OS

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    # Playwright 1.55.1 does not support the ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - name: Run full browser workflow
        shell: bash
        run: |
          pnpm exec next start -p 4198 > /tmp/brothers-os.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4198/ > /dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/brothers-os.log
              exit 1
            fi
            sleep 1
          done
          BROTHERS_OS_BASE_URL=http://127.0.0.1:4198 BROTHERS_OS_FRESH_SERVER_CONFIRMED=1 node scripts/browser-workflow-smoke.mjs
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            logs/browser-workflow*.json
            logs/*.png
          if-no-files-found: ignore
          retention-days: 14
